<section id="events" class="section">
  <h2 class="title">Wedding events</h2>

  @for (e of events; track e.name; let i = $index) {
    <article class="event" [class.alt]="i % 2 === 1">
      <div class="info">
        <h3>{{ e.name }}</h3>
        <p class="when">{{ e.date }}, {{ e.time }}</p>
        <p>{{ e.place }}</p>

        <!-- mobile: help text under the details -->
        <a class="hint" [href]="mapLink(e)" target="_blank" rel="noopener">Open in maps &#8599;</a>
      </div>

      <!-- desktop: appears on hover, on the opposite side of the details -->
      <a class="map" [href]="mapLink(e)" target="_blank" rel="noopener" [attr.aria-label]="'Open ' + e.name + ' venue in maps'">
        <span class="pin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
        </span>
        <span>Open in maps</span>
      </a>
    </article>
  }
</section>
