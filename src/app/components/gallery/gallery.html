<section id="gallery" class="section">
  <h2 class="title">A Gallery Made of Moments</h2>

  <div
    #stage
    class="stage"
    (pointerenter)="onEnter($event)"
    (pointerleave)="paused.set(false)"
    (focusin)="paused.set(true)"
    (focusout)="paused.set(false)"
    (pointerdown)="onDown($event)"
    (pointerup)="onUp($event)"
  >
    @for (c of cards(); track $index; let i = $index) {
      <button
        type="button"
        class="card"
        [style.--x]="c.x"
        [style.--d]="c.d"
        [style.zIndex]="c.z"
        [attr.aria-label]="'Show photo ' + (i + 1)"
        [attr.aria-current]="c.front ? 'true' : null"
        (click)="focus(i)"
      >
        <img [src]="c.src" alt="" draggable="false" loading="lazy" decoding="async" />
      </button>
    }
  </div>

  <!-- <div class="nav">
    <button type="button" (click)="go(-1)" aria-label="Previous photo">&#8249;</button>
    <button type="button" (click)="go(1)" aria-label="Next photo">&#8250;</button>
  </div> -->
</section>
